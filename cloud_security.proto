syntax = "proto3";

package cloudsecurity;

// ---------- GENERAL RESPONSE ----------
message GeneralResponse {
  bool success = 1;
  string message = 2;
}

// ---------- ENROLLMENT ----------
message EnrollmentRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

service EnrollmentService {
  rpc Enroll(EnrollmentRequest) returns (GeneralResponse);
}

// ---------- LOGIN ----------
message LoginRequest {
  string email = 1;
  string password = 2;
}

message OTPRequest {
  string email = 1;
  string otp = 2;
}

service UserService {
  rpc Login(LoginRequest) returns (GeneralResponse);
  rpc VerifyOTP(OTPRequest) returns (GeneralResponse);
}
