<!DOCTYPE html>
<html>
<head>
    <title>User Service Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .message { color: red; font-size: 0.9em; text-align: center; margin-bottom: 10px; }
        .toggle { text-align: center; margin-top: 15px; font-size: 0.85em; }
        .toggle a { color: #007bff; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center;">User Service</h2>
    
    {% if message %}
    <div class="message">{{ message }}</div>
    {% endif %}

    {% if step == 'login' or not step %}
    <div id="login-form">
        <h3 style="text-align:center;">Login</h3>
        <form action="{{ url_for('login') }}" method="POST">
            <input type="hidden" name="action" value="login_otp">
            <input type="email" name="email" placeholder="Enter your email" required>
            <button type="submit">Send OTP</button>
        </form>
        
        <div class="toggle">
            New here? <a href="#" onclick="showRegister()">Create an account</a>
        </div>
    </div>

    <div id="register-form" style="display:none;">
        <h3 style="text-align:center;">Register</h3>
        <form action="{{ url_for('login') }}" method="POST">
            <input type="hidden" name="action" value="register">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" style="background-color: #28a745;">Register</button>
        </form>
        <div class="toggle">
            Already have an account? <a href="#" onclick="showLogin()">Login</a>
        </div>
    </div>
    {% endif %}

    {% if step == 'verify_otp' %}
    <div id="verify-form">
        <h3 style="text-align:center;">Enter OTP</h3>
        <p style="text-align:center; font-size:0.8em; color:#666;">Check the server console for the code!</p>
        <form action="{{ url_for('login') }}" method="POST">
            <input type="hidden" name="action" value="verify_otp">
            <input type="text" name="otp" placeholder="Enter 6-digit OTP" required>
            <button type="submit">Verify & Login</button>
        </form>
    </div>
    {% endif %}

</div>

<script>
    function showRegister() {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('register-form').style.display = 'block';
    }
    function showLogin() {
        document.getElementById('register-form').style.display = 'none';
        document.getElementById('login-form').style.display = 'block';
    }
</script>

</body>
</html>
